services:
  # Redis service
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickdraw-network

  # Backend API service
  backend:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - FRONTEND_CLIENT=${FRONTEND_CLIENT}
      - DASHBOARD_CLIENT=${DASHBOARD_CLIENT}
      - BACKEND_CLIENT=${BACKEND_CLIENT}
      - FRONTEND_PORT=${FRONTEND_PORT:-3030}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8501}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - CORS_ENABLED=${CORS_ENABLED:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_ORIGIN_REGEX=${CORS_ALLOWED_ORIGIN_REGEX}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS}
      - CORS_EXPOSED_HEADERS=${CORS_EXPOSED_HEADERS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_MAX_AGE=${CORS_MAX_AGE:-3600}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}
    working_dir: /app/backend
    command: python app.py
    volumes:
      - ./logs:/app/logs
      - ./backend/uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - quickdraw-network

  # Frontend service
  frontend:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    environment:
      - BACKEND_CLIENT=${BACKEND_CLIENT:-http://localhost:8000}
      - BACKEND_CLIENT=${BACKEND_CLIENT:-http://localhost:8000}
      - BACKEND_HOST=${BACKEND_HOST:-backend}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - FRONTEND_CLIENT=${FRONTEND_CLIENT:-http://localhost:3030}
      - FRONTEND_HOST=${FRONTEND_HOST:-0.0.0.0}
      - DASHBOARD_CLIENT=${DASHBOARD_CLIENT:-http://localhost:8501}
      - DASHBOARD_HOST=${DASHBOARD_HOST:-dashboard}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - FRONTEND_CLIENT=${FRONTEND_CLIENT:-http://localhost:3030}
      - FRONTEND_HOST=${FRONTEND_HOST:-0.0.0.0}
      - DASHBOARD_CLIENT=${DASHBOARD_CLIENT:-http://localhost:8501}
      - DASHBOARD_HOST=${DASHBOARD_HOST:-dashboard}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8501}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}
      - FRONTEND_PORT=${FRONTEND_PORT:-3030}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}
      - FRONTEND_PORT=${FRONTEND_PORT:-3030}
    command: /app/scripts/docker-frontend-start.sh
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FRONTEND_PORT:-3000}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - quickdraw-network

  # Dashboard service
  dashboard:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - QUICKDRAW_BACKEND_URL=${QUICKDRAW_BACKEND_URL:-http://localhost:8000}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
    working_dir: /app/dashboard
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.baseUrlPath=/dashboard
    volumes:
      - ./logs:/app/logs
      - ./dashboard/.streamlit:/app/dashboard/.streamlit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/dashboard/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - quickdraw-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - quickdraw-network



volumes:
  redis_data:

networks:
  quickdraw-network:
    driver: bridge