services:
  # Redis service
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-redis
    # ports:
    #   - "127.0.0.1:${REDIS_PORT:-6379}:6379"  # Only bind to localhost
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_password}
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_secure_password} --protected-mode yes --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-your_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickdraw-network

  # Backend API service
  backend:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_password}
      - PUBLIC_FRONTEND_URL=https://shlab.duckdns.org
    depends_on:
      redis:
        condition: service_healthy
    working_dir: /app/backend
    command: python app.py
    volumes:
      - ./logs:/app/logs
      - ./backend/uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - quickdraw-network

  # Frontend service
  frontend:
    build: .
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-frontend
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      - BACKEND_CLIENT=https://shlab.duckdns.org/api
      - BACKEND_HOST=backend
      - BACKEND_PORT=8080
      - FRONTEND_CLIENT=https://shlab.duckdns.org
      - FRONTEND_HOST=0.0.0.0
      - FRONTEND_PORT=3030
      - DASHBOARD_CLIENT=https://shlab.duckdns.org/dashboard
      - PUBLIC_FRONTEND_URL=https://shlab.duckdns.org
    command: /app/scripts/docker-frontend-start.sh
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - quickdraw-network

  # Dashboard service
  dashboard:
    build:
      context: .
      args:
        INSTALL_DASHBOARD_EXTRAS: "true"
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-dashboard
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - QUICKDRAW_BACKEND_URL=http://backend:8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_secure_password}
      - BACKEND_CLIENT=https://shlab.duckdns.org/api
      - BACKEND_HOST=backend
      - BACKEND_PORT=8080
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /app/dashboard
    command: python -m streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.baseUrlPath=/dashboard
    volumes:
      - ./logs:/app/logs
      - ./dashboard/.streamlit:/app/dashboard/.streamlit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/dashboard/_stcore/health"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - quickdraw-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-quickdraw}-nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - quickdraw-network



volumes:
  redis_data:

networks:
  quickdraw-network:
    driver: bridge