[project]
name = "quickdraw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.3"
dependencies = [
    "fastapi>=0.116.1",
    "joblib>=1.5.2",
    "keras>=3.11.3",
    "llvmlite==0.43.*",
    "numba>=0.60,<0.61",
    "numpy>=1.26",
    "pandas>=2.3.2",
    "pillow==10.1.0",
    "pydantic>=2.11.7",
    "pynndescent>=0.5.12",
    "python-multipart==0.0.6",
    "qrcode[pil]>=8.2",
    "redis>=5.0.0",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "tensorflow[and-cuda]>=2.20.0",
    "umap-learn>=0.5.5",
    "uvicorn>=0.35.0",
    # Additional utilities for dashboard
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
    "pytz>=2022.1",
    "websockets>=15.0.1",
    "aiohttp>=3.12.15",
]

[project.optional-dependencies]
dashboard = [
    # Core Streamlit and web framework
    "streamlit>=1.28.0",
    # Data visualization
    "plotly>=5.15.0",
    "matplotlib>=3.6.0",
    # Statistical analysis
    "scipy>=1.9.0",
    # Optional: For better performance
    "psutil>=5.9.0",
]


[tool.uv.extra-build-dependencies]
numba = ["numpy.distutils"]
